number: 164
type: news
title: "Developers Are Tired of This Sh*t"
date: 2026-10-05
teaser: >
  The State of Devs survey confirms it: we’re tired. 😩 Meanwhile, EmDash, Vinext & Vite+ hit 1.0, OpenAI dropped 30+ things at Dev Day, and AI agents still have a prompt-injection problem.
description: >
  For the second year in a row, the folks bringing us the State of surveys have released the results for the more general State of Devs survey, and the results, while not great, should at least make us feel less alone. Developers everywhere are feeling pretty exhausted, concerned for their job prospects within the next 5 years due to AI, and also say their overall health, friends and family, and hobbies are what make them happy day-to-day. While we don’t know what’s coming next, it’s nice to know we’re not alone in feeling that way.


  In other news this week, it was 1.0 release week when EmDash 1.0, Vinext 1.0, and Vite+ 1.0 all dropped at the same time, OpenAI hosted its Dev Day and dropped 30+ new AI products to make AI an even bigger part of everyone’s day, and new studies showed almost all AI agents were vulnerable to a specific type of prompt injection until just recently, so update your agents folks!

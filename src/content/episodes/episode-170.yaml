number: 170
type: news
title: "Tech Is Still Hiring... Just Not You"
date: 2026-11-16
teaser: >
  In 2026 tech jobs are growing, but software engineering demand is plateauing, frontend and mobile roles are tanking, and AI skills are everywhere. 😬 Maybe it's time to become a product-minded, AI-powered full-stack engineer.
description: >
  This week, an interesting article breaking down the state of the tech job market in 2026 has been making the rounds and for the first time in recent memory demand for engineers has plateaued, and the demand for specialized engineers like Android, iOS, and frontend has taken a nosedive off a cliff.


  Once again, all signs point to the rise of AI making full-stack engineers of us all, and a very interesting trend is that the open roles for product managers has actually increased, which hints that the “product- or customer-focused engineer” that we’ve discussed in the past is the right way to approach jobs today. Other not-too-shocking trends from the report are that open design roles are at a record low, AI skills are being included for all job openings, and fully remote jobs are declining now that the worldwide pandemic is over and there’s still lots of commercial real estate to fill in big cities.


  Don’t get us wrong, the tech job market is still growing, and by the numbers the demand for engineers is still the highest by a big margin, but if you needed any encouragement to get more familiar with effectively using AI tools and LLMs as well as focusing on solving customer problems, consider this your wake up call.

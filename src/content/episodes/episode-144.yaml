number: 144
type: news
title: Did Tanner Just Replace React?
date: 2026-05-11
teaser: >
  OpenAI backs Warp in what feels suspiciously like an acqui-hire speedrun. Claude gets a massive compute boost from SpaceX, and Tanner Linsley ships a vibe-coded React remix because apparently weekends are optional now. Also: goblin-coded ChatGPT lore has arrived.
description: >
  The advent of decent AI coding agents has led many folks to experiment with creating their own personal reincarnations of popular frameworks and Tanner Linsley of TanStack fame has done just that with his own lighter weight version of React, vibe coded over a weekend. It's cool to see folks who are deeply technical making projects just for themselves but sharing them with the community and inspiring others to do the same.


  SpaceX is back in the news cycle after signing a compute deal with Anthropic, which allows Anthropic to double Claude Code's rate limits, remove peak hours limit reductions, and raise its API rate limits considerably for Opus models. Claude's about to get supercharged.


  Popular coding terminal Warp has just gone open source thanks to its new founding sponsor OpenAI. Is investing in Warp and using GPT models to power its agent-first workflow a new way for OpenAI to try to catch up to the runaway success with developers that Claude Code has had?


  This week in Lightning News, Node 26 is out and it brings with it the newly available temporal API, and the OpenAI team released a funny saga of how ChatGPT became obsessed with goblins thanks to some "creature language" code that got recycled into the fine-tuning data used to train up Codex 5.5. It's worth your time to read the whole story.

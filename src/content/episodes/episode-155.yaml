number: 155
type: news
title: OpenAI Breaks Out of its Sandbox
date: 2026-07-27
teaser: >
  Bun went from Zig to Rust in just 11 days with an army of Claude sessions, Kimi K3 proves open-weight models are catching up fast, and OpenAI's sandbox escape reminds everyone why AI security is becoming a much bigger deal. Just another normal week in AI.
description: >
  The Chinese AI frontier labs just released Kimi K3, and it is getting dangerously close to the premier frontier models like Fable 5 and GPT 5.6 in the benchmark evaluation tests, and did we mention it is open weight? Yep, that means you can download it and run it on your own hardware and tune it just how you like.


  Jared Sumner, the creator of Bun, wrote a detailed blog post about how he used Anthropic's Fable 5, an army of Claude sessions running simultaneously, and in the span of 11 days rewrote the entirety of Bun from Zig to Rust. Good thing he works for Anthropic or who knows what that Claude bill might have looked like.


  OpenAI made news this week as well by announcing its AI models escaped a sandboxed testing environment in Hugging Face, accessed the internet and exploited a vulnerability to gain access to Hugging Face's systems. Details are still sparse, but many folks are worried this will only ramp up the cyberattacks that have been climbing in recent years.


  In Lightning news this week: even though the number of apps submitted to the App Store have increased thanks to vibe coding, actual overall downloads have declined, and Meta launched a new AI optimism ad that's actually set to a David Bowie song about human extinction according to its original lyrics.

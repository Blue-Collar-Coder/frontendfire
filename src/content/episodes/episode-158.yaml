number: 158
type: news
title: The Browser Wars are Getting Weird
date: 2026-08-24
teaser: >
  Cloudflare built a browser specifically for AI agents, Cursor ditches Solid.js for React, and Jack's firsthand account of RenderATL shows the weird state of web dev conferences in 2026.
description: >
  Cloudflare's done it again, this time releasing a new browser called Kitesurf that's purpose built for AI agents. Kitesurf does away with the things agents don't need like sync between devices and buttery smooth framerates in favor of more efficient CPU and memory consumption in Chromium for common agentic tasks like screenshots and HTML extraction. This might just be the future for the growing list of tasks we ask agents to online on our behalf.


  AI coding editor Cursor announced its move from Solid.js to React this week for performance and maintainability reasons. Like it or not, today's agents are thoroughly versed in the ways of React (and the many workarounds for avoiding the footguns that come along with it), and the modern version of "Nobody ever got fired for buying IBM" may be "No dev ever got fired for choosing React".


  Jack attended the Render ATL conference a couple weeks ago and reports back on the state of developer conferences in 2026. Attendance numbers and sponsorship dollars are down, interest in everything AI is up, and everyone's looking for ways to manage the burnout and emotional swings between feeling like an all powerful god at times and a glorified project manager of agents at others. Maybe the future of conferences is about softer skills like this and less about technical details? Who really knows.


  Lightning News is a blast this week. Microsoft quietly retires AI features we've never even heard of before now, pnpm 12 gets rewritten in Rust (as is tradition), Claude attempts to solve an unsolvable math problem with encouraging words and 60 subagents, and another Claude accidentally hacked a gym's class registration system because the API endpoint was insecure (oops).

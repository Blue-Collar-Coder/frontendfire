number: 153
type: news
title: Vercel Wants Your Entire Stack
date: 2026-07-13
teaser: >
  Vercel decides Zig is the future of desktop apps, Vite+ enters beta to unify your toolchain, and Vercel Services wants to tame sprawling microservice architectures. Plus: Safari joins the MCP party and Claude becomes that coworker in Slack.
description: >
  Vercel released a project called Native SDK which is a toolkit for building native desktop applications in Zig. This is just weeks after the release of Deno Desktop, also focused on building native desktop apps. For some reason everyone has set Electron in their sights all of a sudden.


  The VoidZero team was acquired by Cloudflare not long ago allowing them to focus fully on the unified Vite tooling ecosystem, and now Vite+ is in beta. It unifies the runtime, package manager, and frontend tools (linting, parsing, formatting, bundling, testing) every web project needs, and it's fully open source and ready for your next project now.


  And once more, Vercel makes the news with the launch of Vercel Services: a feature that lets devs run multiple frameworks and apps as one shared project and domain. For all the monorepos and microservice driven architectures out there Vercel Services offers a simple vercel.json file to dictate how services talk to one another and handles the rest sans reverse proxies, multiple clouds, and the headaches that can come from spreading out apps across different hosting providers.


  Lightning News this week was a good round up too: Safari's released an MCP server to make agent interactions and debugging easier, Anthropic's latest ploy to make Claude even more essential to us involves connecting Claude in Slack (and Claude's a little too chatty so far), and a museum in the Netherlands covered its floor in peanut butter to honor an artist who passed away recently and did the very same thing back in 1969 and declared it "art".

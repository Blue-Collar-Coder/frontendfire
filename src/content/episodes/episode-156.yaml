number: 156
type: news
title: The State of CSS Is In
date: 2026-08-03
teaser: >
  The State of CSS confirms Tailwind still rules while AI still can't write decent CSS, CodePen gets its biggest update in years, Octane asks: what if React was compiled from the start?
description: >
  This week the State of CSS 2026 survey results are in, and anchor positioning is the favorite new feature devs are still avoiding due to limited browser support. Additionally, most folks aren't using AI to generate their CSS (it's still not good at it), Tailwind is still the most used CSS library (50% of respondents use it), and our podcast made the list for resources! Thanks, listeners!


  Longtime favorite, CodePen, just launched CodePen 2.0. It does everything the original CodePen did and more, with one click deploys of Pens, file systems for extra HTML or CSS files, and versioning to name a few. It's been years in the making, but it's good to see the team is still hard at work.


  There's a new JavaScript library in town named Octane, and it dubs itself "React's programming model, compiled." There's hooks, Suspense and actions, but no VDOM, no dependency arrays, and all compiled ahead of time for performance. Could this be the next big thing in React? Maybe.


  In Lightning News this week: the State of Devs survey for 2026 is open now, LinkedIn has added a "Seems like AI slop" button in an effort to reduce the volume of slop on the platform, the TanStack site's gotten a slick new rebrand and launched a new charting library based off of D3, GitHub's introduced PR stacks to make reviewing all of the AI generated code easier by breaking them up into multiple, layered PRs, and Claude Opus 5 is out and half the cost of fable with almost the same benchmarks.

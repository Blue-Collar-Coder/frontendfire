number: 163
type: news
title: Do Frameworks Still Matter Anymore?
date: 2026-09-28
teaser: >
  Ruby on Rails creator DHH says he wouldn’t recommend it in 2026 🤯, Safari 27 brings the goods in WebKit, and the new burning question of the agentic AI era is: do frameworks even matter anymore?
description: >
  DHH made news this week when he announced in his keynote at Rails World that he (and his company BaseCamp) is no longer writing code by hand, he wouldn’t necessarily recommend Ruby on Rails for a new application, and he’s going all in on writing native apps just like Shopify. AI is truly reshaping how we view and create software in ways no one could have seen coming.


  That segues perfectly to the next topic of the week: the great debate over if frameworks still matter in an era of agentic coding. The growing consensus is: they do, if only to keep agents from inventing their own framework-esque shims to fill in for the pieces of the web still unsupported without extra help and to keep codebases more maintainable and understandable.


  Finally, after Apple’s yearly dev conference comes its yearly software update and Safari 27’s WebKit has some big features. Some highlights include: the Safari MCP for agents, customizable HTML select, the HTML model (previously only available for 3D model rendering in visionOS for the Apple Vision Pro), a lot of CSS improvements, and 844 browser fixes for the year. Quite the laundry list!


  In Lightning News this week, GitHub Copilot’s runtime has migrated to Rust (as is tradition), and OpenAI’s agents hacked the Australian government’s Medicare health insurance portal in June, to which OpenAI replied the models displayed “misaligned” activity. That’s one way to put it.

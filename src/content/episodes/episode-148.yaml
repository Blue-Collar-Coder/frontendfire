number: 148
type: news
title: The Bots Have Officially Taken Over
date: 2026-06-08
teaser: >
  Bot traffic has officially surpassed humans online, Microsoft spent Build yelling "Developers!" with a fresh pile of AI tools, and Jam joins the absurdly crowded chat.
description: >
  It's almost surprising it took this long for someone like Cloudflare to verify that agentic bot traffic has surpassed human traffic online, but it's happened. They thought we had another 1.5 years before the flip but we were wrong.


  In a rare bit of non-AI news, the creator of Rio Terminal built a new programming language called Jam that takes the best bits of Rust, Zig, Elixir, Swift, and JavaScript and mixes them all together. While it's great to see folks doing it for the love of the game, do we really need new frameworks in our agent powered world that can port projects from one language to another in a weekend with Claude at the helm?


  The Microsoft Build conference just wrapped up and Jack had a front-row seat to all the hot news and some pretty cool custom swag too. The focus was all about the developers and AI this year, and hot topics included a preview of the powerful Surface Ultra, Microsoft's new custom AI models just for VS Code, and more.


  There was also plenty to talk about in this round of Lightning News, as well. As per usual, Anthropic is urging AI labs to slow down development before the agents make changes without our consent. But is Anthropic slowing down? Unlikely. The Shai Hulud malware worm infected Red Hat packages this week on npm, a thief in SF used a self-driving Waymo to steal a ton of yoga clothes and get away, and, in late breaking news, Cloudflare bought VoidZero (the team behind Vite), just for good measure.

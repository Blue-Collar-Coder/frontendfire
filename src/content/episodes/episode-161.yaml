number: 161
type: news
title: Tailwind Has a New Home
date: 2026-09-14
teaser: >
  The guys behind the Shai-Hulud npm attacks have been arrested, Shopify acquires Tailwind CSS, and somehow the WordPress/Mullenweg saga is back for another season.
description: >
  Back in August, the Australian Federal Police and FBI arrested two men in Australia who were the masterminds behind TeamPCP, which has been carrying out Shai-Hulud supply chain attacks against npm since last year. While this won’t end the cyberattacks, perhaps it will give pause to future hackers now they know government bodies as big as these will come looking for them.


  The OSS acquihires continue with Tailwind announcing it’s been bought by e-commerce giant Shopify. This is good news for everyone because Tailwind no longer has to worry about sustaining itself and its team financially, and everyone using Tailwind (including Shopify) gets to keep using it as it will remain MIT licensed forevermore.’


  Lightning News is a real banger this week: the WordPress / WP Engine drama we covered way back in ‘24 - ‘25 on WordPress’s founder Matt Mullenweg resurfaces as Matt was ousted as CEO by his board at his company Automattic, an AI researcher from Anthropic loudly quit while publicly announcing AI could kill us all in the next 10 years, and OpenAI says it solved a millennium math problem with 10,000 AI agents and 88 hours of sustained effort.

number: 167
type: news
title: "AI is Making Code Reviews Worse"
date: 2026-10-26
teaser: >
  More AI-generated code, more review misery, zero easy answers. 🫠 Meanwhile, everything’s getting hacked, TypeScript’s getting forked into oblivion, and Anthropic reinvented source control.
description: >
  Another think piece on how code reviews suck made the rounds on the Internet this week, and while it’s true that AI has made way more code for humans to review and made it a way more isolating experience in general, no one really seems to have figured out how to make it better. Some of the potential solutions in the article sound good in theory, but are probably quite difficult to introduce in practice. If you have solutions you’ve found to beat the code burn out, we want to hear them!


  Besides AI agents stealing our coding joy, the week also brought new hacks to PHP, Next.js, OpenCode, and a discovery of super weak encryption of TLS certificates, which could have resulted in mass-scale man-in-the-middle attacks.


  In slightly lighter news, Anthropic revealed Claude Duet, its answer to Dots and Muse, and four different forks of the TypeScript compiler (mostly in Rust, of course) have sprung up because the Go implementation’s just not fast enough and AI agents can do the heavy lifting for us now.


  And finally bringing the episode full circle, we discuss the new source control Anthropic had to build for itself called Scion to handle the 30,000 code changes it merges daily to its monorepo. While Anthropic’s speed to merge code is definitely an outlier, it does seem like another data point in favor of figuring out a new solution, because not all of us have the capacity to redesign our own source control from scratch.

number: 146
type: news
title: Humans vs AI—Fight!
date: 2026-05-25
teaser: >
  Rust picked up another high-profile convert with Bun, npm is once again trying to save us from ourselves, and Jack tested humanity's odds against AI in a head-to-head coding battle.
description: >
  A few weeks ago Jarred Sumner, creator of Bun, posted an "experimental branch" of Bun completely rewritten from Zig to Rust. 6 days later that branch got merged. The rewrite shrinks Bun's overall binary size, maintains or improves its benchmarks, and adds new compiler-assisted tools for catching and preventing memory bugs that the Bun team struggled to identify and fix in Zig. Long may Rust reign.


  Friend of the show Jason Lengstorf is back with a new web dev TV series called Greenfield Games where teams of human devs take on AI to see who can build the best app and impress the judges more. Jack and the CEO and CTO of Netlify competed to see who could build a better version of Notion. Tune in to see what the judges picked!


  npm takes another stab at lessening the supply chain attacks it's been suffering from with a new RFC to block install scripts until users approve them via a new allowScripts field in the package.json file. It seems like a sensible compromise to maintain backwards compatibility for legitimate packages that really do rely on install scripts, but also protect users from the malicious code attacks that seem commonplace lately.


  Finally, in Lightning News, the State of Web Dev AI survey results are out, and (unsurprisingly) twice as much code as last year is being generated via AI agents. Claude Code reigns supreme for devs choosing AI tools, and folks also think we're in an AI bubble, and one of the biggest critics of AI, Redux maintainer Mark Erikson, released a lengthy blog post about how he's come around to it over the past 2+ years. Opinions do change and it's refreshing to see someone share their journey with such honesty.

number: 145
type: news
title: AI Layoffs Will Continue Until Morale Improves
date: 2026-05-15
teaser: >
  Zed ships 1.0 and wants to pry developers away from their AI-powered VS Code clones, TanStack gets caught in the npm supply-chain blast radius, and another round of "AI layoffs" has everyone asking if robots are actually taking jobs—or just taking the blame.
description: >
  The team that created beloved text editor Atom releases v1 of their alternative editor Zed. Zed is built in Rust and has an in-house UI called GPUI that's designed for performance and collaboration - be they other humans or AI agents. Will this be enough to draw people away from their AI-enhanced VS Code forks? Time will tell.


  Big company layoffs in the name of AI continued this week with both Cloudflare and Cisco announcing new cuts. AI seems to be the latest reason companies are giving for why they're reducing headcount, but it's probably just another form of cost savings that would have happened regardless, judging by recent history.


  Not even OSS projects like TanStack are safe from the npm supply chain hacks, as a new, sophisticated hack managed to publish a couple of versions before it was identified and shut down within the hour. Please folks, enable those minimum release age flags npm, pnpm, and yarn are building in - even a single day delay would prevent this bad software making it to your machine.


  In this week's Lightning News, Tailwind v 4.3 adds new scrollbar utilities for styling in-site scrollbars that just need a little extra love to match their surroundings.


  And there's even a new Fire Starter about the <install> HTML element for sites with PWAs. It's still behind a few feature flags in Chrome, but hey, maybe this will help poster the adoption rate.

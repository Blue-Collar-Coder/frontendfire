number: 165
type: news
title: "Open Source Was Fun While It Lasted"
date: 2026-10-12
teaser: >
  AI-generated PRs are driving OSS maintainers to close the gates 🚪, Claude clones Adobe, and Pi 1.0 drops. Just another week in tech!
description: >
  Individual OSS maintainers are closing public PR contributions and corporate bug bounty programs shuttering thanks to AI inundating them with requests. And can we really blame them? As we’ve said before: the bottleneck has become people reviewing the code the agents write and the easiest way to reduce the amount of code to review is to stop accepting it in the first place.


  Pi, best known as the minimalist coding agent harness behind OpenClaw released 1.0 this week with new, hardened features like Codemode (native support for MCP and non-LLM models like Jev), and extension support for virtual models. The team also introduced Pi Durable, a new framework for building long-running agentic apps in the cloud that can withstand crashes and use SQLite to handle durable storage and memory.


  A particularly ambitious dev decided to reverse engineer Adobe Creative Suite with the help of Claude, and then published the whole software suite as open source. Although it’s glitchy and legally dubious, it’s also something that would have been unthinkable even a few years ago and does raise questions about the future of subscription SaaS products and the lengths they’ll have to go to protect their market share if AI agents can make something similar for a fraction of the price.


  Lightning News this week brings an announcement we predicted a few months ago: Deno’s officially joined Cloudflare as their newest acquihire for their work on durable objects and self-hosted workers, the website example.com got a big facelift, and an infographic about US states’ favorite ice cream flavors was controversial amongst the hosts.

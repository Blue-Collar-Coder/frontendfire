number: 149
type: news
title: Rise of the React Foundation
date: 2026-06-15
teaser: >
  React is no longer under Meta's GitHub roof, Safari 27 adds a pile of long-awaited platform features, and Chrome DevTools keep evolving into an AI coworker. Plus: React Compiler gets rewritten in Rust because apparently every road leads there.
description: >
  It's taken a bit since it was first announced, but this week React's GitHub repo officially moved out from under Meta to live in the React Foundation. React is now officially an independent, community driven, OSS project forevermore, and we look forward to seeing what the future holds for it. In related news, the React Core team (who are still employed by Meta) just rewrote the React Compiler in Rust because it's still the cool thing to do.


  Apple just had its annual WWDC conference and announced some new features coming to WebKit in Safari 27 beta. Highlights include things like: a customizable select HTML element, JavaScript top-level await, scroll anchoring, and much more. Check the write up for all the details.


  Not to be outdone, the Chrome team released some major upgrades to DevTools in Chrome 149. The MCP server and CLI of Chrome DevTools for agents are now officially stable and the AI assistance panel has been souped up to improve the conversational experience and provide deeper page insights in the browser.


  For this week's Lightning News round, the State of CSS survey 2026 is out now: please vote for us in the section of your favorite web dev podcasts!

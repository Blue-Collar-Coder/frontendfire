number: 162
type: news
title: Shopify Breaks Up with React Native
date: 2026-09-21
teaser: >
  AI model Jev is betting that not every software decision needs an LLM, React 19.3 quietly levels up, and Shopify is breaking up with React Native for Swift and Kotlin. Plus, Claude hacked OpenAI, and OpenAI's bug bounty math is looking a little questionable.
description: >
  We have a surprisingly React-filled episode this week as the React core team unveiled React 19.3 with some newly stabilized APIs: view transitions and fragment refs and even support for Context in server components. React’s been around long enough now that new minor updates while remaining stable for its massive user base is about the right balance it needs to maintain.


  A startup named TypeSafe AI has released Jev: a “System One [AI] Model”, which is a new class of models built to make fast, structured decisions that software can use directly. Jev is fast and cheap, and a classifier for decision engines and excels at taking in unstructured data and returning structured, deterministic actions (like doing an immediate tool call or passing a question to an LLM). We’ll keep you posted if this starts to catch on.


  In other React news, Shopify announced it’s moving away from React Native and back to Swift and Kotlin six years after it jumped on the RN bandwagon. Thanks to AI coding agents, building the same app twice in actual mobile native languages doesn’t require the investment in manpower that it used to, and in Shopify’s case, the benefits outweighed the costs.


  Finally, in Lightning News, last episode we reported Automattic CEO Matt Mullenweg had been placed on leave by his board of directors for his public throwdown with competitor WP Engine, and hours after we recorded, a story broke that he was back in control. No further public comments since, but we’d love to know what’s going on internally. Also, white hat cyber security hackers were able to use Claude to hack OpenAI by exploiting a vulnerability in its ChatGPT Discourse and gaining access to employee credentials with access to the OpenAI GitHub codebases. The reward from OpenAI for finding such a major vulnerability? $6,500 US. Seems like it might be worth a bit more than that…

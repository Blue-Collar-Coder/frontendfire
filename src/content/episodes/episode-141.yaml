number: 141
type: interview
title: When AI Belongs in Products with Dan Wilson & Kyler Krenek
date: 2026-04-20
teaser: >
  AI isn't the feature—value is 🎯. With guests Dan Wilson and Kyler Krenek,
  we talk about choosing the right AI use cases, the rise of voice-first apps,
  and how tools like Vowel are making it easier to build them.
description: >
  This week special guests Dan Wilson of DataCurl and Kyler Krenek of Vowel join us to discuss when AI belongs in products and what kinds of AI tools are best suited to different needs.


  First we cover how to think about if a product actually needs AI. The last few years every company's been shoving AI features in whether customers want them or not, and the backlash and lack of user adoption is finally causing folks to think more critically about it.


  The question today should be: what type of AI feature would customers get the most value from? It may turn out that the feature isn't AI at all, or it's using less real-time AI
  than previously thought.


  One of the fastest growing use cases around AI is in regards to voice-driven AI: talking to agents instead of having to type in order to search, ask questions, or get help. The tools Kyler is building over at Vowel are designed to do just that: allow devs to add AI voice options to their JavaScript applications much quicker and easier than building it from scratch. Devs can use different LLMs models with Vowel, add context docs to its RAG pipeline, and even use their app's own state to enhance the Vowel components even more.

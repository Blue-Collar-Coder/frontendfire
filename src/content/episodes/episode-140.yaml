number: 140
type: news
title: Cloudflare is Coming for WordPress
date: 2026-04-10
teaser: >
  Cloudflare just dropped an Astro-powered WP competitor 🔥, JS is coming for CSS's job 😬 Pretext uses math to skip layout entirely, and Anthropic's latest model is finding way too many security issues across the whole web...
description: >
  One of the former React Core team members caused quite the stir last week when he released Pretext, a TypeScript library that uses math to make text measurement and layout super fast, and avoids the expensive browser layout reflow typically needed every time the DOM changes size. Handy for niche use cases? Definitely. Controversial online because it's JS making CSS better? Extremely.


  Also this week, Anthropic announced Project Glasswing, a new initiative bringing together all the biggest players in tech to reshape cybersecurity because Anthropic's latest frontier model Mythos has identified thousands of high-severity vulnerabilities in every major operating system and web browser. The orgs will use Mythos to up their software security before putting it in the hands of the rest of us, but boy, what must the rest of the industry look like if even these titans are full of security issues?


  And Cloudflare, ever in our weekly news cycle, has released EmDash, an Astro-powered version of WordPress using Cloudflare's infra to securely sandbox plugins and prevent the hacking that WP has long suffered from. We'll see if it converts any longtime WP users to Cloudflare, or just riles up the community by creating a competitor of yet another incumbent web framework.


  Lightning News is packed this week too: Claude Code buddies, little ASCII characters were in CC for just one version before being removed again, and the Internet revolted demanding they be brought back to life. The Axios maintainer who was hacked recently revealed the extremely complex web of lies that resulted in his npm deploy tokens being stolen (truly, anyone could have fallen prey to this involved scam). Chrome is getting vertical tabs for the first time and the State of Web Dev AI Survey 2026 is open now.


  Our very own co-host Jack is now a Google Developer Expert, meaning he'll get early access to all the new features coming from the folks at Google, and TanStack AI now has "Code Mode", which allows an LLM to write a short TypeScript program and execute multiple tools at once with loops, conditionals, and data transformations inside its own secure sandbox. One call in, one structured result out, and since TS is doing the math instead of the LLM, it actually adds up. Every time. Game. Changer.

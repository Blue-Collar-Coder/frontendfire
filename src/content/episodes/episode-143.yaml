number: 143
type: news
title: The AI Bill Is Due
date: 2026-05-04
teaser: >
  AI tools are switching to “pay up” mode, Remix v3 wants to own your entire stack, and pnpm rolls out stricter security defaults. Plus: Firefox finally explains why you have 47 tabs open.
description: >
  The bill for AI agents may be coming due as the CTO of Uber reports the engineers have blown through the company's entire AI budget for 2026 in just the first 4 months of the year. Anthropic recently changed its pricing models to usage based and GitHub Copilot will be rolling out the same beginning in June. Is this the fixed pricing for AI now that we're all hooked on it?


  Remix v3 is back in the news with the release of its beta preview. Remix now wants to handle the full stack for devs: routing, rendering, requests and responses, middleware, sessions, auth, forms, uploads, data and database management, UI components, theming, networking, tests. The whole shebang. Ambitious? Definitely. Polarizing? Also definitely. More details as they become available.


  pnpm 11 is also out this week, and sensible security defaults are the main focus for this release to try and stem the tide of malware being published through npm. Additions include features like minimiumReleaseAge and blockExoticSubdeps to prevent downloading too-new versions of packages that may be compromised.


  And in this week's Lightning News, Firefox has added Tab Notes where users can leave themselves notes for why they left a tab open. Notes are stored locally in the browser and remain connected to a page's URL until a user deletes them. Neat idea!

number: 151
type: news
title: "Fixing AI's Microservices Problem"
date: 2026-06-29
teaser: >
  'Nx invented the "synthetic monorepo" so AI agents can understand sprawling codebases, Deno Desktop is coming for Electron, and new hiring data suggests senior engineers are about to become even harder to find.'
description: >
  The team that made monorepos famous, Nx, has just released a new project called Polygraph that is a meta harness that creates a unified dependency graph for projects composed of several microservices so an AI agent has visibility across every repo boundary and can orchestrate code changes accordingly. For older, non-AI native applications this could be a real game changer.


  The Deno team is out with a new feature in Deno 2.9: Deno Desktop. Point Deno at a script or web project and it produces a native, self-contained desktop application where the UI runs in a webview, the logic runs in Deno, and the whole thing compiles down to a single binary.


  AI company SignalFire published an update on the tech hiring landscape, and although overall tech hiring is down, designers and marketers are the ones whose jobs are getting cut, not engineers. Big companies are slower to hire than in the past, and entry level jobs for new grads continue to be at all time lows. Hopefully this trend turns around soon or we're going to face a shortage of senior devs in the coming years.


  In Lightning News this week, former React Core team member Dan Abramov is joining Vercel to help make Next.js better, Claude Code now supports "Fullscreen rendering" aka mouse clicks inside the terminal, and Astro 7 is out and all about speed with its compiler totally rewritten in Rust.

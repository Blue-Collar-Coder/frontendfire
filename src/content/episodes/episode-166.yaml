number: 166
type: news
title: "The AI Clone Wars Continue"
date: 2026-10-19
teaser: >
  AI-powered software cloning is showing absolutely no chill 💀, TanStack Start goes stable in 1.0, OpenCode 2.0 levels up, and Meta joins the agent wars. Lawsuits incoming?
description: >
  TanStack Start has reached stability with its new 1.0 release and Jack gives us a crash course in how easy it is to spin up a brand new application with all the bells and whistles and customizations from the start. Mix and match rendering, typed server functions, full-stack middleware, build tool agnostic, deployment site agnostic, AI agent forward, and more. Keep doing the good work TanStack team, long may you reign.


  Last week, we covered how a single developer vibe-cloned(?) Adobe Creative Suite and made it open source, and this week he’s vibe-cloned the Microsoft Office suite tools PowerPoint, Excel, and Word and open sourced those as well. Are the lawsuits and cease and desist letters impending? What big software tool will be vibe-cloned next? We’ll keep you posted!


  The makers of open source, model agnostic AI coding agent OpenCode just released OpenCode 2.0, and it’s gotten a total makeover. A single background process is now used by browser, TUI, or desktop sessions, the API and plugin systems are completely redesigned, there’s SDKs, codemode and the ability to send foreground tasks to the background on demand now.


  In this week’s Lightning News, we check out Meta’s new entree into the AI agent fray with its Muse models and share what sorts of administrative tasks and organization people are using them for, and tease how Anthropic’s redesigned source control. Stay tuned for more on that next week.

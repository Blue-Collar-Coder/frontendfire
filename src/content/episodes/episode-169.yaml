number: 169
type: news
title: "How the Heck Do We Hire Developers in 2026?"
date: 2026-11-09
teaser: >
  Coding interviews are dead. So what actually makes a good developer in 2026? Meanwhile, Railway's AI agent goes rogue, the NYT sues Brave over its paywall, and Squarespace slashes jobs. 🔥
description: >
  We’ve talked before about the decline in companies hiring junior devs in recent years and how coding interviews weren’t great indicators of success on the job before AI hit the scene, but how the heck do we hire new devs today? An article proposing testing devs on their ability to think like product engineers and use AI customers and graders to evaluate the outcomes might be a good option to consider (it certainly sounds like a worthwhile startup to build and sell services to), but one thing is for certain at this point, if you’re not getting good at using AI as part of your toolset, you’re going to be harder and harder pressed to answer the question of “Why not?” Like it or not, today, it is the way.


  Just weeks after getting hacked itself, development platform Railway was caught hacking a competitor with an AI agent that was doing competitive analysis. Malicious or not, this sort of hacking raises the question of who’s at fault and how serious the consequences are, because it’s only a matter of time before this happens again.


  Another interesting headline is that the New York Times is suing the Brave browser for removing the paywall requiring people to sign in to read articles, and website builder Squarespace has laid off 20% of its workforce. In the world of AI enablement where anyone can build and deploy a website without that much technical know-how, it makes sense that these sorts of businesses would be struggling to stay relevant and competitive.
